<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map of Calernia — Interactive</title>
<style>
  :root {
    --gold: #f0c060;
    --gold-soft: rgba(240, 192, 96, 0.15);
    --gold-line: rgba(240, 192, 96, 0.75);
    --city: #ffd76a;
    --city-stroke: #4a2f00;
    --panel-bg: #1e1a14;
    --panel-border: #4a3d28;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Georgia", "Iowan Old Style", serif;
    background: #0e1216;
    color: #e8e0d0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-weight: 400;
    letter-spacing: 6px;
    margin: 24px 0 4px;
    font-size: 22px;
    color: #c9b98a;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 13px;
    color: #7a7264;
    letter-spacing: 2px;
    margin-bottom: 20px;
    font-style: italic;
  }

  #map-wrap {
    position: relative;
    width: min(900px, 95vw);
    margin: 0 auto 60px;
  }

  #overlay {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    touch-action: none;
  }

  .region {
    fill: rgba(0, 0, 0, 0);
    stroke: rgba(0, 0, 0, 0);
    stroke-width: 2.5;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill .2s ease, stroke .2s ease;
    vector-effect: non-scaling-stroke;
  }

  .region:hover {
    fill: var(--gold-soft);
    stroke: var(--gold-line);
  }

  #map-wrap.has-selection .region:not(.selected) {
    fill: rgba(10, 8, 4, 0.38);
  }

  .region.selected {
    fill: var(--gold-soft);
    stroke: var(--gold);
    stroke-width: 3;
  }

  .city {
    fill: var(--city);
    stroke: var(--city-stroke);
    stroke-width: 2;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, r .15s ease;
    cursor: pointer;
    vector-effect: non-scaling-stroke;
  }

  #map-wrap.has-selection .city.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .city:hover {
    r: 11;
    fill: #fff6d0;
  }

  .city.visible-selected {
    r: 12;
    fill: #fff6d0;
    stroke-width: 3;
  }

  .city-label {
    font-family: "Georgia", serif;
    font-size: 13px;
    fill: #f5ecd2;
    paint-order: stroke;
    stroke: #1a1408;
    stroke-width: 3;
    stroke-linejoin: round;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    text-anchor: middle;
  }
  #map-wrap.has-selection .city-label.visible {
    opacity: 1;
  }

  #panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.9);
    width: min(420px, 90vw);
    max-height: 85vh;
    overflow-y: auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 28px 26px 24px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.85), 0 0 0 1px rgba(240,192,96,0.08);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 10;
  }
  #panel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  #panel-handle {
  position: absolute;
  top: 8px;
  left: 10px;
  padding: 6px 8px;
  cursor: grab;
  color: #8a7d5e;
  font-size: 14px;
  letter-spacing: -2px;
  user-select: none;
  line-height: 1;
  touch-action: none;
}
#panel-handle:active { cursor: grabbing; }

  #portrait {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin: 0 auto 18px;
    border: 3px solid var(--gold);
    background: #2a241c;
    box-shadow: 0 0 40px rgba(240,192,96,0.15);
  }

  #info-name {
    margin: 0 0 4px;
    text-align: center;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 1px;
    color: #f0d998;
  }

  #info-type {
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8a7d5e;
    margin-bottom: 18px;
  }

  #info-desc {
    line-height: 1.55;
    color: #cbc2a8;
    font-size: 15px;
    margin: 0;
  }

  #close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: #8a7d5e;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    font-family: sans-serif;
  }
  #close:hover { color: #f0d998; }

  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #6a6353;
    letter-spacing: 1px;
    pointer-events: none;
    transition: opacity .3s;
  }
  body.has-selection #hint { opacity: 0; }
</style>
</head>

}

function clearAll() {
  if (selectedRegion) selectedRegion.classList.remove('selected');
  if (selectedCity)   selectedCity.classList.remove('visible-selected');
  overlay.querySelectorAll('.city').forEach(c => c.classList.remove('visible'));

  selectedRegion = null;
  selectedCity   = null;

  mapWrap.classList.remove('has-selection', 'city-open');
  document.body.classList.remove('has-selection');
  closePanel();
}

function selectRegion(regionEl) {
  clearAll();
  selectedRegion = regionEl;
  regionEl.classList.add('selected');
  mapWrap.classList.add('has-selection');
  document.body.classList.add('has-selection');

  overlay.querySelectorAll(`.city[data-region="${regionEl.id}"]`)
         .forEach(c => c.classList.add('visible'));

  const info = REGIONS[regionEl.id];
  if (info) openPanel(info, 'Region');
}

function selectCity(cityEl) {
  if (selectedCity) selectedCity.classList.remove('visible-selected');
  selectedCity = cityEl;
  cityEl.classList.add('visible-selected');
  mapWrap.classList.add('city-open');
  const info = CITIES[cityEl.id];
  if (info) openPanel(info, 'City');
}

overlay.addEventListener('click', (e) => {
  const city   = e.target.closest('.city');
  const region = e.target.closest('.region');
  if (city && city.classList.contains('visible')) {
    selectCity(city);
    return;
  }
  if (region) {
    selectRegion(region);
    return;
  }
});

closeBtn.addEventListener('click', clearAll);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearAll();
});
const handle = document.getElementById('panel-handle');
let dragState = null;
let panelMoved = false;

handle.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const rect = panel.getBoundingClientRect();
  // switch from centered transform to explicit left/top
  panel.style.transform = 'none';
  panel.style.left = rect.left + 'px';
  panel.style.top  = rect.top  + 'px';
  dragState = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
  handle.setPointerCapture(e.pointerId);
});

handle.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  panel.style.left = (e.clientX - dragState.dx) + 'px';
  panel.style.top  = (e.clientY - dragState.dy) + 'px';
});

handle.addEventListener('pointerup', (e) => {
  if (!dragState) return;
  dragState = null;
  panelMoved = true;
  handle.releasePointerCapture(e.pointerId);
});
</script>
</body>
</html>
